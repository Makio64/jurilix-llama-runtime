name: Build patched llama.cpp runtime

on:
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: Instead of building, publish the Windows artifacts of this successful run
        required: false
        default: ''
      release_tag:
        description: Release (draft allowed) that receives them
        required: false
        default: ''

permissions:
  contents: read

jobs:
  runtime:
    name: ${{ matrix.variant }}
    if: inputs.publish_run_id == ''
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: macos-arm64, os: macos-15 }
          - { variant: macos-x64, os: macos-15-intel }
          - { variant: linux-x64, os: ubuntu-24.04 }
          - { variant: win-cpu-x64, os: windows-2022 }
          - { variant: win-vulkan-x64, os: windows-2022 }
          - { variant: win-cuda-x64, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test the build and packaging receipts
        run: python -m unittest discover -s tests/scripts -p 'test_*.py'
      - name: Prepare verified upstream source and patch
        run: python scripts/build-patched-llama.py --variant ${{ matrix.variant }} --prepare-only
      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Ninja on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Ninja on Windows
        if: runner.os == 'Windows'
        run: choco install ninja -y
      - name: Install Vulkan SDK
        if: matrix.variant == 'win-vulkan-x64'
        shell: pwsh
        run: |
          $version = '1.4.357.0'
          $installer = Join-Path $env:RUNNER_TEMP 'VulkanSDK-Installer.exe'
          curl.exe --fail --location --output $installer "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan SDK download failed' }
          & $installer --accept-licenses --default-answer --confirm-command install
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan SDK installation failed' }
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$version"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$version\bin"
      - name: Build and run parser tests on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          python scripts/build-patched-llama.py --variant ${{ matrix.variant == 'win-cuda-x64' && 'win-cpu-x64' || matrix.variant }} --jobs 3
      - name: Build and run parser tests on Unix
        if: runner.os != 'Windows'
        run: python scripts/build-patched-llama.py --variant ${{ matrix.variant }} --jobs 3
      - name: Install the pinned PE import reader
        if: matrix.variant == 'win-cuda-x64'
        run: python -m pip install --disable-pip-version-check pefile==2024.8.26
      - name: Compose the unchanged pinned upstream CUDA plugin
        if: matrix.variant == 'win-cuda-x64'
        run: python scripts/compose-cuda-runtime.py --cpu-receipt tmp/gemma-runtime/artifacts/llama-b11835-jurilix1-bin-win-cpu-x64.json --output tmp/gemma-runtime/cuda-original
      - name: Split bounded CUDA downloads
        if: matrix.variant == 'win-cuda-x64'
        run: python scripts/split-cuda-runtime.py --receipt tmp/gemma-runtime/cuda-original/llama-b11835-jurilix1-bin-win-cuda-x64.json --output tmp/gemma-runtime/cuda-downloads
      - name: Preserve runtime, checksums and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gemma-runtime-${{ matrix.variant }}
          path: |
            tmp/gemma-runtime/artifacts/
            tmp/gemma-runtime/cuda-original/*.json
            tmp/gemma-runtime/cuda-original/*.log
            tmp/gemma-runtime/cuda-downloads/
          if-no-files-found: error
          retention-days: 30

  # Moves Windows artifacts from a build run to its release without leaving
  # GitHub (the CUDA runtime alone is ~660 MB), after verifying receipts,
  # parser logs and archives.
  publish-windows:
    if: inputs.publish_run_id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.publish_run_id }}
      TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a successful build run
        run: test "$(gh run view "$RUN_ID" --repo "$REPO" --json conclusion,workflowName --jq '.workflowName + ":" + .conclusion')" = "Build patched llama.cpp runtime:success"
      - name: Download native Windows artifacts
        run: |
          for variant in win-cpu-x64 win-vulkan-x64 win-cuda-x64; do
            gh run download "$RUN_ID" --repo "$REPO" --name "gemma-runtime-$variant" --dir "ci/gemma-runtime-$variant"
          done
      - name: Verify receipts, parser logs and archives
        run: python3 scripts/verify-ci-artifacts.py --ci ci --out publish --tag "$TAG" win-cpu-x64 win-vulkan-x64 win-cuda-x64
      - name: Attach to the release
        run: gh release upload "$TAG" publish/* --repo "$REPO"
