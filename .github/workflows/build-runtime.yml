name: Compose Jurilix CUDA fallback

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Run with successful pinned Windows CPU and Vulkan jobs
        required: true
        default: '42164158002'
      release_tag:
        description: Optional existing draft release receiving verified packages
        required: false
        default: ''

permissions:
  actions: read
  contents: write

jobs:
  compose:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NATIVE_RUN_ID: ${{ inputs.native_run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Require passing native CPU and Vulkan jobs
        shell: pwsh
        run: |
          if ($env:NATIVE_RUN_ID -notmatch '^\d+$') { throw 'Invalid run ID' }
          $run = gh api "repos/$env:REPO/actions/runs/$env:NATIVE_RUN_ID/jobs?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Native run lookup failed' }
          foreach ($variant in @('win-cpu-x64','win-vulkan-x64')) {
            $jobs = @($run.jobs | Where-Object { $_.name -eq $variant -and $_.conclusion -eq 'success' })
            if ($jobs.Count -ne 1) { throw "Expected one successful native job for $variant" }
          }
      - name: Test receipt and packaging verification
        run: python -B -m unittest discover -s tests/scripts -p 'test_*.py'
      - name: Install pinned PE import reader
        run: python -m pip install --disable-pip-version-check pefile==2024.8.26
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gemma-runtime-win-cpu-x64
          path: tmp/ci/gemma-runtime-win-cpu-x64
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: gemma-runtime-win-vulkan-x64
          path: tmp/ci/gemma-runtime-win-vulkan-x64
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
      - name: Compose patched core with exact official CUDA and probe native imports
        shell: pwsh
        run: |
          $receipts = @(Get-ChildItem 'tmp/ci/gemma-runtime-win-cpu-x64' -Recurse -Filter 'llama-b12144-jurilix1-bin-win-cpu-x64.json')
          if ($receipts.Count -ne 1) { throw 'Expected one exact native CPU receipt' }
          python scripts/compose-cuda-runtime-b12144.py --cpu-receipt $receipts[0].FullName --output tmp/ci/gemma-runtime-win-cuda-x64/native-cuda
          if ($LASTEXITCODE -ne 0) { throw 'CUDA composition or native probes failed' }
      - name: Split bounded CUDA packages
        run: python scripts/split-cuda-runtime.py --receipt tmp/ci/gemma-runtime-win-cuda-x64/native-cuda/llama-b12144-jurilix1-bin-win-cuda-x64.json --output tmp/ci/gemma-runtime-win-cuda-x64/cuda-downloads
      - name: Verify every source receipt, log, archive and runtime file
        run: python scripts/verify-ci-artifacts.py --ci tmp/ci --out publish --tag b12144-jurilix1 win-cpu-x64 win-vulkan-x64 win-cuda-x64
      - name: Preserve compact verified metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jurilix-cuda-fallback-metadata
          path: |
            publish/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Attach verified packages only to the requested draft release
        if: inputs.release_tag != ''
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -ne 'b12144-jurilix1') { throw 'Release does not match pinned runtime' }
          $release = gh release view $env:RELEASE_TAG --repo $env:REPO --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.isDraft) { throw 'Expected an existing draft release' }
          gh release upload $env:RELEASE_TAG (Get-ChildItem publish -File).FullName --repo $env:REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Draft upload failed' }
      - name: Preserve source and native verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jurilix-cuda-fallback-verified
          path: |
            publish/
            tmp/ci/gemma-runtime-win-cuda-x64/native-cuda/*.log
            tmp/ci/gemma-runtime-win-cuda-x64/native-cuda/*.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
