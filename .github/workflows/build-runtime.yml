name: Publish selected Jurilix runtime
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify and publish only the selected successful fallback payload
        run: python3 -B -u scripts/publish-selected-b12144-fallback.py
      - name: Preserve release digest verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jurilix-b12144-selected-publication
          path: tmp/llama-runtime-b12144/fallback-publication/
          if-no-files-found: error
          retention-days: 7
